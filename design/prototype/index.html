<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curator</title>
<style>
:root{--bg:#121110;--surface:#1c1a18;--surface2:#262321;--line:#34302c;--text:#f3efe8;--muted:#a39b90;--accent:#e0b25c;--accent-ink:#1a1305;--ok:#7fc79a;--warn:#e0b25c;--bad:#e07a6a;--r:14px}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f2ea;--surface:#fff;--surface2:#efe9dd;--line:#ddd4c3;--text:#201b14;--muted:#7a705f;--accent:#a86f12;--accent-ink:#fff;--ok:#2f7d4f;--warn:#a86f12;--bad:#b0432f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{min-height:100dvh;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:600 22px/1 Georgia,'Iowan Old Style',serif;margin:0;letter-spacing:.2px}
.pill{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;min-height:40px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.off .dot{background:var(--bad)}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 16px inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:34px 16px;text-align:center;background:var(--surface);color:var(--muted)}
.drop strong{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
.drop .btn{margin-top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 15px inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0005}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0}
.frame{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;touch-action:none}
.frame img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hint{position:absolute;left:8px;bottom:8px;font-size:12px;background:#000a;color:#fff;border-radius:6px;padding:3px 8px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:14px}
.meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{border:0;background:none;color:var(--muted);min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.bar{height:3px;background:var(--surface2)}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;color:inherit;text-align:left}
.tile .art{aspect-ratio:16/9;display:block;width:100%}
.tile small{display:block;padding:8px 10px;color:var(--muted);font-size:13px}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.row .art{width:72px;aspect-ratio:16/9;border-radius:6px;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.row .t span{font-size:13px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;min-height:64px;border:0;background:none;color:var(--muted);font:600 12px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button[aria-current=page]{color:var(--accent)}
nav button{white-space:nowrap}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet .in{width:100%;max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet .art{aspect-ratio:16/9;border-radius:10px;width:100%}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.note{font-size:13px;color:var(--muted);margin:8px 2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Curator</h1>
  <button class="pill" id="tv" aria-label="TV status. Tap to switch the demo TV on or off."><span class="dot"></span><span id="tvtxt">Frame online · Art Mode</span></button>
</header>

<main>
<section id="add">
  <div class="drop" id="drop">
    <strong>Add photos to your Frame</strong>
    Pick from your camera roll or files.
    <button class="btn primary" id="choose">Choose photos</button>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </div>
  <div id="batch" hidden>
    <h2>How should they fit?</h2>
    <div class="seg" role="group" aria-label="Fit mode">
      <button aria-pressed="true" data-mode="crop">Fill screen</button>
      <button aria-pressed="false" data-mode="fit">Show whole photo</button>
    </div>
    <p class="note" id="modenote">Fill screen trims the edges. Drag a photo to choose what stays.</p>
    <div id="cards"></div>
    <button class="btn primary" id="send">Send to Frame</button>
    <button class="btn" id="more" style="margin-top:10px">Add more photos</button>
  </div>
</section>

<section id="library" hidden>
  <h2>On your Frame</h2>
  <div class="grid" id="grid"></div>
  <p class="note">Tap a photo to show it now or remove it. Your Samsung art stays untouched.</p>
</section>

<section id="queue" hidden>
  <h2>Activity</h2>
  <div id="jobs"></div>
</section>
</main>
</div>

<div class="sheet" id="sheet"><div class="in">
  <div class="art" id="sart"></div>
  <b id="stitle"></b>
  <button class="btn primary" id="show">Show now</button>
  <button class="btn danger" id="del">Remove from Frame</button>
  <button class="btn" id="close">Cancel</button>
</div></div>

<nav aria-label="Sections">
  <button data-tab="add" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  <button data-tab="library"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>On the TV</button>
  <button data-tab="queue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity<span id="qn"></span></button>
</nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const gradients=[['#2b5876','#4e4376'],['#c06c84','#f8b195'],['#355c7d','#6c5b7b'],['#134e5e','#71b280'],['#5f2c82','#49a09d'],['#cb2d3e','#ef473a']];
const art=(i)=>`linear-gradient(135deg,${gradients[i%6][0]},${gradients[i%6][1]})`;
let tvOn=true, mode='crop', items=[], jobs=[], tvArt=[
 {id:1,name:'Evening Lake',g:0,now:true},{id:2,name:'Peach Dunes',g:1},{id:3,name:'Blue Hour',g:2},{id:4,name:'Green Ridge',g:3}], sel=null, n=0;

function tab(t){$$('main>section').forEach(s=>s.hidden=s.id!==t);$$('nav button').forEach(b=>b.dataset.tab===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));render()}
$$('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

$('#tv').onclick=()=>{tvOn=!tvOn;$('#tv').classList.toggle('off',!tvOn);$('#tvtxt').textContent=tvOn?'Frame online · Art Mode':'TV is off · will retry';if(tvOn)flush();render()};
$('#choose').onclick=$('#more').onclick=()=>$('#file').click();
$('#file').onchange=e=>{for(const f of e.target.files){items.push({f,url:URL.createObjectURL(f),x:50,y:50})}e.target.value='';render()};
$$('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#modenote').textContent=mode==='crop'?'Fill screen trims the edges. Drag a photo to choose what stays.':'The whole photo is shown with black bars where it does not fill the screen.';render()});

function renderAdd(){
  $('#drop').hidden=items.length>0;$('#batch').hidden=!items.length;
  $('#cards').innerHTML='';
  items.forEach((it,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="frame"><img alt="" src="${it.url}" style="object-fit:${mode==='crop'?'cover':'contain'};object-position:${it.x}% ${it.y}%">${mode==='crop'?'<span class="hint">Drag to reposition</span>':''}</div>
      <div class="meta"><span>${it.f.name}</span><button class="rm" aria-label="Remove ${it.f.name}">✕</button></div>`;
    c.querySelector('.rm').onclick=()=>{items.splice(i,1);render()};
    if(mode==='crop'){const fr=c.querySelector('.frame'),im=c.querySelector('img');let d=null;
      fr.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,ox:it.x,oy:it.y};fr.setPointerCapture(e.pointerId)};
      fr.onpointermove=e=>{if(!d)return;it.x=Math.min(100,Math.max(0,d.ox-(e.clientX-d.x)/fr.clientWidth*100));it.y=Math.min(100,Math.max(0,d.oy-(e.clientY-d.y)/fr.clientHeight*100));im.style.objectPosition=`${it.x}% ${it.y}%`};
      fr.onpointerup=()=>d=null}
    $('#cards').append(c)});
  $('#send').textContent=`Send ${items.length} to Frame`;
}
$('#send').onclick=()=>{
  items.forEach(it=>{jobs.unshift({id:++n,name:it.f.name,url:it.url,state:'preparing',p:0})});
  items=[];tab('queue');jobs.filter(j=>j.state==='preparing').forEach(run)};
function run(j){let p=0;const t=setInterval(()=>{p+=25;j.p=p;if(p>=100){clearInterval(t);j.state='waiting';tvOn?upload(j):0}render()},350)}
function upload(j){j.state='sending';render();setTimeout(()=>{if(!tvOn){j.state='waiting';render();return}j.state='done';tvArt.unshift({id:100+j.id,name:j.name.replace(/\.[^.]+$/,''),url:j.url});render()},1400)}
function flush(){jobs.filter(j=>j.state==='waiting'||j.state==='failed').forEach(upload)}

function tile(a,i){return a.url?`background:url(${a.url}) center/cover`:`background:${art(a.g??i)}`}
function renderLib(){
  $('#grid').innerHTML='';
  tvArt.forEach((a,i)=>{const b=document.createElement('button');b.className='tile';
    b.innerHTML=`<span class="art" style="${tile(a,i)}"></span>${a.now?'<span class="badge">Showing</span>':''}<small>${a.name}</small>`;
    b.onclick=()=>{sel=a;$('#sart').style.cssText=tile(a,i);$('#stitle').textContent=a.name;$('#sheet').classList.add('open')};$('#grid').append(b)});
}
$('#close').onclick=()=>$('#sheet').classList.remove('open');
$('#show').onclick=()=>{tvArt.forEach(a=>a.now=a===sel);$('#sheet').classList.remove('open');renderLib()};
$('#del').onclick=()=>{tvArt=tvArt.filter(a=>a!==sel);$('#sheet').classList.remove('open');renderLib()};

const label={preparing:['Preparing','warn'],waiting:['Waiting for TV','warn'],sending:['Sending…','warn'],done:['On the TV','ok'],failed:['Failed','bad']};
function renderJobs(){
  $('#jobs').innerHTML=jobs.length?'':'<div class="empty">Nothing yet. Photos you send show up here.</div>';
  jobs.forEach(j=>{const [t,c]=label[j.state];const r=document.createElement('div');r.className='row';
    r.innerHTML=`<span class="art" style="background:url(${j.url}) center/cover"></span><div class="t"><b>${j.name}</b><span>${j.state==='waiting'?'The TV is off. Curator keeps trying.':j.state==='preparing'?j.p+'%':''}</span></div><span class="chip ${c}">${t}</span>`;
    $('#jobs').append(r)});
  const open=jobs.filter(j=>j.state!=='done').length;$('#qn').textContent=open?` (${open})`:'';
}
function render(){renderAdd();renderLib();renderJobs()}
render();
</script>
</body>
</html>

# Settings for the Raspberry Pi. deploy/install.sh copies this file to
# /opt/curator/config/local.toml if that file does not exist yet.
[tv]
host = "192.168.1.20"
port = 8002
token_file = "config/token.txt"   # copy the token from the Mac, see docs/DEPLOY.md
name = "Curator"

[web]
# The Pi home Wi-Fi address only. This keeps Curator off Tailscale and other networks.
# Give the Pi a fixed address on the router, or this address can change.
bind = "192.168.1.10"
port = 8080

[storage]
data_dir = "data"

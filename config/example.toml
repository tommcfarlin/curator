# `python -m curator.setup` writes config/local.toml for you. To write it by hand,
# copy this file to config/local.toml. Git ignores the copy.
[tv]
host = "192.168.1.20"   # the address of your TV
port = 8002
# The pairing token is saved here after the first Allow on the TV.
token_file = "config/token.txt"
name = "Curator"
# Optional. The Wi-Fi hardware address of the TV. Curator learns it by itself
# while the TV is on, and uses it to find the TV if the router gives it a new address.
# mac = "AA:BB:CC:DD:EE:FF"

[web]
bind = "0.0.0.0"
port = 8080

[storage]
data_dir = "data"
inbox_dir = "inbox"

[image]
width = 3840
height = 2160
jpeg_quality = 92
